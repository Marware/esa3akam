name: Publish to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify release tag signature
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag_object_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq 'select(.object.type == "tag") | .object.sha'
          )"
          test -n "$tag_object_sha"
          gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
            --jq 'select(.verification.verified == true and .verification.reason == "valid") | .tag' \
            | grep --fixed-strings --line-regexp -- "$RELEASE_TAG"

      - name: Verify release source and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]

          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"release tag {actual_tag!r} does not match {expected_tag!r}"
              )
          PY

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python -m unittest discover -v

      - name: Install locked build toolchain
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          --requirement requirements-build.txt

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/esa3akam
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          attestations: true
          verify-metadata: true
          skip-existing: false
